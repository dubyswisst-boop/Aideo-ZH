name: Build Aideo Chinese Edition (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Unsigned test build or verified signed release candidate (no public Release)'
        type: choice
        default: test-unsigned
        options:
          - test-unsigned
          - release-signed

permissions:
  contents: read

jobs:
  windows-installer:
    if: inputs.mode == 'test-unsigned'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v7

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure protoc
        shell: pwsh
        run: |
          $protoc = (Get-Command protoc).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and frontend tests
        run: |
          npm run check:locales
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Native checks
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned Chinese edition NSIS EXE
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          PROTOC: ${{ env.PROTOC }}
        run: npm run tauri -- build --config src-tauri/tauri.zh.conf.json --bundles nsis --target x86_64-pc-windows-msvc --ci --no-sign

      - name: Upload UNSIGNED TEST ONLY artifacts (public repository artifacts are not private)
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-TEST-ONLY-aideo-zh-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  windows-release:
    if: inputs.mode == 'release-signed'
    runs-on: windows-latest
    environment: windows-signing
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      # No default provider: the confirmed publisher is an individual in China,
      # currently ineligible for Azure Public Trust individual identity validation.
      WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
      WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
      WINDOWS_TIMESTAMP_URL: http://timestamp.acs.microsoft.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require approved signing identity and environment reviewers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_APPROVED: ${{ vars.WINDOWS_SIGNING_APPROVED }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_SIGNING_PROVIDER -cne 'artifact-signing') {
            throw 'No approved hosted signing provider configured. SignPath eligibility is pending; Azure Public Trust is unavailable to the current Chinese individual publisher.'
          }
          foreach ($name in @('SIGNING_ENDPOINT','SIGNING_ACCOUNT','SIGNING_PROFILE','WINDOWS_SIGNING_PUBLISHER')) {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing approved signing configuration: $name" }
          }
          if ($env:SIGNING_APPROVED -cne 'true') { throw 'Signing service has not been explicitly approved. No unsigned release fallback.' }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/environments/windows-signing"
          $environment = Invoke-RestMethod -Uri $uri -Headers @{Authorization="Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version'='2022-11-28'}
          $reviewers = @($environment.protection_rules | Where-Object { $_.type -eq 'required_reviewers' -and $_.reviewers.Count -gt 0 -and $_.prevent_self_review })
          if (!$reviewers.Count -or $environment.can_admins_bypass) { throw 'Signing environment must require independent reviewers and prohibit admin bypass.' }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - uses: arduino/setup-protoc@v3
        with:
          version: '25.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Frontend and native checks
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Optional externally approved provider, NOT a claim of SignPath eligibility.
      # No client secret or certificate private key is exported to this repository.
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Artifact Signing client and metadata
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.146 -OutputDirectory "$env:RUNNER_TEMP/signing-client" -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Get-ChildItem "$env:RUNNER_TEMP/signing-client" -Filter Azure.CodeSigning.Dlib.dll -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (!$dll) { throw 'Artifact Signing x64 client missing.' }
          $metadataPath = "$env:RUNNER_TEMP/artifact-signing-metadata.json"
          @{ Endpoint=$env:SIGNING_ENDPOINT; CodeSigningAccountName=$env:SIGNING_ACCOUNT; CertificateProfileName=$env:SIGNING_PROFILE } | ConvertTo-Json | Set-Content -LiteralPath $metadataPath
          "ARTIFACT_SIGNING_DLIB=$($dll.FullName)" >> $env:GITHUB_ENV
          "ARTIFACT_SIGNING_METADATA=$metadataPath" >> $env:GITHUB_ENV
          "PROTOC=$((Get-Command protoc).Source)" >> $env:GITHUB_ENV

      - name: Build and sign application, NSIS plugins, uninstaller and installer
        shell: pwsh
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          ./scripts/sign-windows.ps1 -CheckConfiguration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run tauri -- build --config src-tauri/tauri.zh.conf.json --config src-tauri/tauri.windows-signing.conf.json --bundles nsis --target x86_64-pc-windows-msvc --ci

      - name: Extract final package, verify every PE and scan with Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter *.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one signed x64 NSIS installer.' }
          $installer = $installers[0]
          $payload = "$env:RUNNER_TEMP/final-payload"
          & 'C:/Program Files/7-Zip/7z.exe' x $installer.FullName "-o$payload" -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed.' }
          ./scripts/verify-windows-release.ps1 -Installer $installer.FullName -PayloadDirectory $payload -ExpectedPublisher $env:WINDOWS_SIGNING_PUBLISHER -ReportPath "$env:RUNNER_TEMP/signatures.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/scan-windows-release.ps1 -Path $installer.FullName -ReportPath "$env:RUNNER_TEMP/defender-installer.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/scan-windows-release.ps1 -Path $payload -ReportPath "$env:RUNNER_TEMP/defender-payload.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-windows-install.ps1 -Installer $installer.FullName -ExpectedPublisher $env:WINDOWS_SIGNING_PUBLISHER -ReportDirectory "$env:RUNNER_TEMP/install-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory release-verified | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination release-verified
          Copy-Item "$env:RUNNER_TEMP/signatures.json","$env:RUNNER_TEMP/defender-installer.json","$env:RUNNER_TEMP/defender-payload.json" -Destination release-verified
          Copy-Item "$env:RUNNER_TEMP/install-smoke/*.json" -Destination release-verified
          $staged = Join-Path 'release-verified' $installer.Name
          $hash = (Get-FileHash -LiteralPath $staged -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Staged installer changed.' }
          "$hash  $($installer.Name)" | Set-Content release-verified/SHA256SUMS -Encoding ascii

      - name: Upload verified signed candidate only (no public Release)
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-VERIFIED-aideo-zh-windows-x64
          path: release-verified/
          if-no-files-found: error
