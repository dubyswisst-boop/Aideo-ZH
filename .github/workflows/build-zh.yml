name: Build Aideo Chinese Edition (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v7

      - name: Install protoc
        uses: uses: arduino/setup-protoc@v3
        with:
          version: '25.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure protoc
        shell: pwsh
        run: |
          $protoc = (Get-Command protoc).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and frontend tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Native checks
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned Chinese edition EXE and MSI
        env:
          PROTOC: ${{ env.PROTOC }}
        run: npm run tauri -- build --config src-tauri/tauri.zh.conf.json --bundles nsis,msi

      - name: Upload private run artifacts (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: aideo-zh-windows-x64-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
