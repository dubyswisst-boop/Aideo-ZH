name: Aideo-ZH Playerbar Auto-hide Preview
on:
  workflow_dispatch:
  push:
    branches:
      - test/playerbar-autohide-validation
    paths:
      - 'src/App.tsx'
      - 'src/App.css'
      - 'tools/playerbar-preview/**'
      - '.github/workflows/aideo-playerbar-preview.yml'
permissions:
  contents: read
jobs:
  typecheck-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Install Playwright isolated
        run: npm install --prefix tools/playerbar-preview --no-save --package-lock=false --ignore-scripts --legacy-peer-deps playwright@1.56.1
      - name: Install Chromium
        run: ./tools/playerbar-preview/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser tests against app CSS
        run: node tools/playerbar-preview/check.mjs
